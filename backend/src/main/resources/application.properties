# ===================================================================
# APPLICATION & IMPORTATION DU FICHIER .env
# ===================================================================
spring.application.name=nexomanager-backend
server.port=${SERVER_PORT:8080}

# Lecture native du fichier .env situé à la racine du projet
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# BASE DE DONNÉES MYSQL (AVEC createDatabaseIfNotExist=true)
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca

# ===================================================================
# MIGRATIONS FLYWAY
# ===================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# UPLOAD DE FICHIERS (DOCUMENTS CLIENTS & PHOTOS VÉHICULES)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===================================================================
# SÉCURITÉ JJWT & CORS (NEXOMANAGER.APP)
# ===================================================================
nexomanager.domain=${APP_DOMAIN:NexoManager.app}
nexomanager.security.jwt.secret-base64=${JWT_SECRET_BASE64}
nexomanager.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
nexomanager.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===================================================================
# GESTION DES ERREURS SERVEUR (SANS EXPOSER LA STACKTRACE)
# ===================================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never